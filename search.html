    <main class="container">
      <h1>Results</h1>
      <div id="result">Searching...</div>
      <script>
        const params = new URLSearchParams(window.location.search);
        const query = params.get('query');
        const input = document.getElementById('search-input');
        if ( input ) {
          input.value = query;
        }
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = "Searching for " + query + "...";
        fetch('/lunr.json')
        .then( response => { return response.json(); } )
        .then( json => {
          const idx = lunr( function () {
            this.ref('id')
            this.field('title', { boost: 30 });
            this.field('tags', { boost: 20 });
            this.field('text', { boost: 5 });
            this.field('location');
            for(let i=0; i<json.length; ++i) {
              this.add(json[i]);
            }
          });
          const result = idx.search(query);
          if( result.length ) {
            resultDiv.innerHTML = '';
            const ul = document.createElement("ul");
            result.map( (item) => {
              const li = document.createElement("li");
              const a = document.createElement("a");
              a.href = json[item.ref].location;
              const txtTitle = document.createTextNode( json[item.ref].title );
              a.appendChild( txtTitle );
              li.appendChild( a );
              ul.appendChild( li );
              // console.log( item );
            });
            resultDiv.appendChild(ul);
          } else {
            resultDiv.innerHTML = "No matching for " + query + "...";
            const sadnessImg = document.createElement("img");
            sadnessImg.src = "404_sadness.gif";
            resultDiv.appendChild( sadnessImg );
          }
        })
        .catch( err => { console.error( err ); });
      </script>
